services:
  - type: web
    name: newen
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: newen-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: newen-db
    databaseName: newen
    plan: free
